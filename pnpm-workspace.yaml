packages:
  - "apps/*"
  - "packages/*"
  - "database"

allowBuilds:
  # These packages need their install scripts to prepare native binaries
  # (Prisma query engine, esbuild binary, sharp/libvips, argon2 binding).
  '@node-rs/argon2': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - dotenv@18.0.8
