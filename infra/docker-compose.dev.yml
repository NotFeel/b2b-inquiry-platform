services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b2b_catalog
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_local_only
    ports:
      # Host port is overridable so a machine that already runs PostgreSQL can
      # still start this stack (POSTGRES_HOST_PORT=55432 docker compose up).
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d b2b_catalog']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
