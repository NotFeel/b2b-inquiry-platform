services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b2b_catalog
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_local_only
    ports:
      # Host port is overridable so a machine that already runs PostgreSQL can
      # still start this stack (POSTGRES_HOST_PORT=55432 docker compose up).
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d b2b_catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # See POSTGRES_HOST_PORT above (REDIS_HOST_PORT=6380 docker compose up).
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
