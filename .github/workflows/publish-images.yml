name: Publish production images
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: main
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-production-images
  cancel-in-progress: false
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source on GitHub-hosted runner only
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Capture checked-out source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify database release tooling is included in this source ref
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f database/prisma/seed.ts
          test -f database/scripts/check-menu-translations.ts
          test -f database/scripts/check-production-reference-data.ts
          test -f database/scripts/exec.mjs
          test -d database/prisma/migrations
          test -f infra/production/deploy.sh
          echo "Database migrations, production reference seed/verification, and deploy script are present."
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: pnpm
      - name: Install and verify monorepo build
        env:
          ADMIN_API_PROXY_TARGET: http://api:3002
          STOREFRONT_API_PROXY_TARGET: http://api:3002
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          # The production reference-data checker is TypeScript but is run directly
          # by the release script, so typecheck it before publishing the runtime image.
          pnpm typecheck
          pnpm build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image owner
        id: image
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push Storefront
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/production/Dockerfile
          target: storefront
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/b2b-inquiry-platform-storefront:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront
          build-args: |
            STOREFRONT_API_PROXY_TARGET=http://api:3002
      - name: Build and push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/production/Dockerfile
          target: admin
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/b2b-inquiry-platform-admin:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
          build-args: |
            ADMIN_API_PROXY_TARGET=http://api:3002
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/production/Dockerfile
          target: api
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/b2b-inquiry-platform-api:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/production/Dockerfile
          target: worker
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/b2b-inquiry-platform-worker:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Write immutable image manifest
        run: |
          {
            echo "Commit: ${{ steps.source.outputs.sha }}"
            echo "Storefront: ghcr.io/${{ steps.image.outputs.owner }}/b2b-inquiry-platform-storefront:sha-${{ steps.source.outputs.sha }}"
            echo "Admin: ghcr.io/${{ steps.image.outputs.owner }}/b2b-inquiry-platform-admin:sha-${{ steps.source.outputs.sha }}"
            echo "API: ghcr.io/${{ steps.image.outputs.owner }}/b2b-inquiry-platform-api:sha-${{ steps.source.outputs.sha }}"
            echo "Worker: ghcr.io/${{ steps.image.outputs.owner }}/b2b-inquiry-platform-worker:sha-${{ steps.source.outputs.sha }}"
          } | tee image-manifest.txt

      # Keep the newest 10 versions per package for rollback.
      # Run cleanup only after all four images have been successfully published.
      - name: Retain recent Storefront image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: b2b-inquiry-platform-storefront
          package-type: container
          min-versions-to-keep: 5
      - name: Retain recent Admin image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: b2b-inquiry-platform-admin
          package-type: container
          min-versions-to-keep: 5
      - name: Retain recent API image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: b2b-inquiry-platform-api
          package-type: container
          min-versions-to-keep: 5
      - name: Retain recent Worker image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: b2b-inquiry-platform-worker
          package-type: container
          min-versions-to-keep: 5
